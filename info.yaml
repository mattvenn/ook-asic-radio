# Tiny Tapeout project information
project:
  title:        "433 MHz OOK radio"      # Project title
  author:       "Matt Venn"      # Your name
  discord:      "mattvenn"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "433 MHz on-off-keyed radio link: ring-oscillator TX, envelope-detector RX, Gold-code correlation"      # One line description of what your project does
  language:     "Analog" # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values for analog projects: 1x2, 2x2

  # How many analog pins does your project use?
  analog_pins: 5        # Valid values: 0 to 6
  uses_vapwr: true       # Set to true if your project uses second analog power supply (VAPWR) in addition to 1.8V (VDPWR)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_mattvenn_radio"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:        
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "code bit 0"
  ui[1]: "code bit 1"
  ui[2]: "code bit 2"
  ui[3]: "code bit 3"
  ui[4]: "code bit 4"
  ui[5]: "code bit 5"
  ui[6]: "code bit 6"
  ui[7]: "role (1 = TX, 0 = RX)"

  # Outputs
  uo[0]: "segment a"
  uo[1]: "segment b"
  uo[2]: "segment c"
  uo[3]: "segment d"
  uo[4]: "segment e"
  uo[5]: "segment f"
  uo[6]: "segment g"
  uo[7]: "dp: LED toggle (RX)"

  # Bidirectional pins
  uio[0]: "mode select (strap)"
  uio[1]: "mode select (strap)"
  uio[2]: "raw TX key in / data UART"
  uio[3]: "raw RX comparator out"
  uio[4]: "debug: burst detected"
  uio[5]: "debug: toggle event"
  uio[6]: "debug: trim direction"
  uio[7]: "debug: TX active"

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "TX dipole +"
  ua[1]: "TX dipole -"
  ua[2]: "RX dipole +"
  ua[3]: "RX dipole -"
  ua[4]: "debug: detector output"
  ua[5]: ""

# Do not change!
yaml_version: 6
