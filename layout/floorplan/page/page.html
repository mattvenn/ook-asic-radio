<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: a layout-editor workbench. Canvas fills the left, a dense inspector column on the right; stacks on phones. */
:root {
  --bg: #eef0ec; --panel: #f8f9f6; --ink: #1d2320; --muted: #5f6a64; --line: #cfd5cf; --grid: #dfe4de;
  --die: #fbfcfa; --accent: #0f6e63; --accent-ink: #ffffff; --sel: #d9480f;
  --rx: #127a6c; --late: #b4237d; --rxin: #0b5fa5; --clk: #c2410c; --en: #8a6a12; --bias: #4d7c0f; --tx: #b45309; --trim: #6d28d9; --dig: #475569;
  --decap: #7b8794; --pass: #2f7d32; --warn: #b7791f; --fail: #c0392b; --info: #6b7280;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ui: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --panel: #181d1b; --ink: #e3e8e4; --muted: #94a19a; --line: #2c3430; --grid: #222a26;
  --die: #0d100f; --accent: #3fb8a6; --accent-ink: #06201c; --sel: #ff8a4c;
  --rx: #3fc1ad; --late: #ef6ab8; --rxin: #5aa9ef; --clk: #fb8a4a; --en: #d9b44a; --bias: #9acd4c; --tx: #f2a23a; --trim: #a78bfa; --dig: #94a3b8;
  --decap: #8b98a6; --pass: #5cbf60; --warn: #e3a83b; --fail: #f0675a; --info: #9aa3ad; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121614; --panel: #181d1b; --ink: #e3e8e4; --muted: #94a19a; --line: #2c3430; --grid: #222a26;
  --die: #0d100f; --accent: #3fb8a6; --accent-ink: #06201c; --sel: #ff8a4c;
  --rx: #3fc1ad; --late: #ef6ab8; --rxin: #5aa9ef; --clk: #fb8a4a; --en: #d9b44a; --bias: #9acd4c; --tx: #f2a23a; --trim: #a78bfa; --dig: #94a3b8;
  --decap: #8b98a6; --pass: #5cbf60; --warn: #e3a83b; --fail: #f0675a; --info: #9aa3ad; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--ui); }
button, input, select, textarea { font: inherit; color: inherit }
.app { display: block }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel) }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0 }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .01em }
.brand .sub { font: 12px var(--mono); color: var(--muted) }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; order: 3; flex: 1 1 100%; min-width: 0 }
.tools { margin-left: auto }
.tab { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; padding: 4px 10px; border-radius: 3px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.tab .dots { font: 11px var(--mono); margin-left: 6px; opacity: .85 }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--die); padding: 4px 10px; border-radius: 3px; cursor: pointer }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn:disabled { opacity: .45; cursor: default }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px }
.sync { font: 12px var(--mono); color: var(--muted) }
main { display: block }
.stage { position: relative; width: 100%; height: max(300px, min(calc(100vw * 0.56), calc(100vh - 96px))); overflow: hidden; background: var(--bg); border-bottom: 1px solid var(--line) }
svg#cv { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; cursor: grab }
svg#cv.panning { cursor: grabbing }
.overlay { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden }
.seg button { border: 0; background: var(--die); padding: 4px 12px; cursor: pointer }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.diagram .keys, .diagram .overlay, .diagram .coords { display: none }
svg#cv.dg { cursor: default }
.dg [data-dinst] { cursor: pointer }
.dg [data-dinst]:hover rect.blk { stroke-width: 2.4 }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); cursor: pointer }
.chip input { margin: 0 }
.coords { position: absolute; right: 12px; bottom: 12px; font: 12px var(--mono); color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 2px 8px; border-radius: 3px }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font: 12px var(--mono); padding: 3px 7px; border-radius: 3px; white-space: nowrap; z-index: 3 }
.keys { position: absolute; right: 12px; top: 12px; font: 11px var(--mono); color: var(--muted); text-align: right; line-height: 1.5 }
aside { background: var(--panel); display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); align-items: start; min-width: 0 }
section.box { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; min-width: 0 }
#secChecks { grid-row: span 3 }
section.box > h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
section.box > h2 .meta { letter-spacing: 0; text-transform: none; font: 12px var(--mono) }
.empty { color: var(--muted); font-size: 13px }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font: 12px var(--mono) }
.kv dt { color: var(--muted) } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums }
label.f { display: grid; gap: 2px; font-size: 12px; color: var(--muted) }
input[type=number], input[type=text], select, textarea { background: var(--die); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; min-width: 0 }
input[type=number] { width: 84px; font-family: var(--mono); font-size: 12px }
textarea { width: 100%; font: 12px var(--mono); resize: vertical }
.orients { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px }
.orients button { padding: 3px 0; font: 12px var(--mono) }
.orients button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.checks { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none }
.check { position: relative; cursor: help; display: grid; grid-template-columns: 44px 1fr auto; gap: 2px 8px; align-items: baseline; padding: 6px 8px; border-radius: 3px; background: var(--die); border-left: 3px solid var(--info) }
.check .why { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 6; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 3px; font-size: 12px; line-height: 1.45; box-shadow: 0 4px 14px rgb(0 0 0 / .25) }
.check .why b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; opacity: .75 }
.check:hover .why, .check:focus .why { display: block }
.check:hover, .check:focus { outline: 1px solid var(--line) }
.check.pass { border-left-color: var(--pass) } .check.warn { border-left-color: var(--warn) } .check.fail { border-left-color: var(--fail) }
.check .st { font: 600 11px var(--mono); text-transform: uppercase }
.check.pass .st { color: var(--pass) } .check.warn .st { color: var(--warn) } .check.fail .st { color: var(--fail) } .check.info .st { color: var(--info) }
.check .t { font-weight: 600 } .check .v { font: 12px var(--mono); font-variant-numeric: tabular-nums; text-align: right }
.check .d { grid-column: 2 / 4; font-size: 12px; color: var(--muted) }
.summary { display: flex; gap: 10px; font: 12px var(--mono) }
.summary b { font-weight: 600 }
.bar { height: 12px; display: flex; border-radius: 2px; overflow: hidden; background: var(--grid) }
.bar span { display: block; height: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted) }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px }
.tbl { width: 100%; border-collapse: collapse; font: 12px var(--mono); font-variant-numeric: tabular-nums }
.tbl td { padding: 2px 4px; border-bottom: 1px solid var(--grid) } .tbl td.n { text-align: right }
.tbl tr:hover td { background: var(--grid); cursor: default }
.scroll { max-height: 280px; overflow-y: auto }
.note { font-size: 12px; color: var(--muted); white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.note.open { display: block }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; justify-self: start }

.warnbox { font-size: 12px; padding: 6px 8px; border-radius: 3px; background: var(--die); border-left: 3px solid var(--warn) }
.ro .edit-only { display: none !important }
details > summary { cursor: pointer; font-size: 12px; color: var(--muted) }
@media (max-width: 860px) {
  .stage { height: min(62vh, 80vw); min-height: 300px }
  .keys { display: none }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="app" id="app">
  <header>
    <div class="brand"><h1>OOK Radio Floorplan</h1><span class="sub">tt_analog_3x2_3v3 · 493.12 × 225.76 µm</span></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Variants"></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="View"><button id="mLayout" data-mode="layout">Layout</button><button id="mDiagram" data-mode="diagram">Block diagram</button></div>
      <button class="btn" id="bFull" title="Fill the screen (Esc to leave)">Full screen</button>
      <button class="btn edit-only" id="bDup" title="Copy this variant">Duplicate</button>
      <button class="btn edit-only" id="bRen">Rename</button>
      <button class="btn edit-only" id="bDel">Delete</button>
      <button class="btn edit-only" id="bNew" title="A new variant with the macro placed and every other block parked under the tile">Blank</button>
      <span class="sync" id="sync">connecting…</span>
    </div>
  </header>
  <main>
    <div class="stage" id="stage">
      <svg id="cv" aria-label="Tile floorplan"></svg>
      <div class="keys">drag: move · wheel: zoom · drag empty: pan · shift-drag: select a group · shift-click: add / remove<br>Esc clear · R rotate · X flip ↕ (MX) · Y flip ↔ (MY) · arrows nudge · F fit</div>
      <div class="overlay" id="layers"></div>
      <div class="coords" id="coords">x –, y – µm</div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside id="side">
      <section class="box" id="secVariant"></section>
      <section class="box" id="secSel"></section>
      <section class="box" id="secChecks"></section>
      <section class="box" id="secArea"></section>
      <section class="box" id="secNets"></section>
      <section class="box" id="secStraps"></section>
      <section class="box" id="secIO"></section>
      <section class="box" id="secSettings"></section>
    </aside>
  </main>
</div>

<script>
(function () {
'use strict';
const DATA = window.FP_DATA, FP = window.FP, CAT = FP.buildCatalog(DATA), TILE = DATA.tile, H = TILE.h, W = TILE.w;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f1 = (x) => (Math.round(x * 100) / 100).toString();
const snap = (x) => Math.round(x * 2) / 2;
const NET_COLOR = { rxin: 'var(--rxin)', rx: 'var(--rx)', late: 'var(--late)', clk: 'var(--clk)', en: 'var(--en)', bias: 'var(--bias)', tx: 'var(--tx)', trim: 'var(--trim)' };
const GROUP_COLOR = { rx: 'var(--rx)', tx: 'var(--tx)', trim: 'var(--trim)', bias: 'var(--bias)', dig: 'var(--dig)' };
const STRAP_COLOR = { VGND: 'var(--dig)', VAPWR: 'var(--tx)', VDPWR: 'var(--rx)' };

// ---- state
const S = {
  variants: {},          // id -> variant body (from the store, or local when there is no store)
  order: [],
  cur: null,
  sel: null,             // {kind: 'inst'|'decap'|'strap', id}
  settings: Object.assign({}, FP.DEFAULT_SETTINGS),
  view: null,
  mode: 'layout',
  layers: { flylines: true, pins: true, m4: false, labels: true, grid: true, decap: true },
  hoverNet: null,
  canWrite: true, db: null, user: null, uid: null, names: {},
  dirty: new Set(), saving: new Set(), dragging: false,
};
try { const l = JSON.parse(localStorage.getItem('fp.layers') || 'null'); if (l) Object.assign(S.layers, l); } catch (e) {}
try { if (localStorage.getItem('fp.mode') === 'diagram') S.mode = 'diagram'; } catch (e) {}

const clone = (o) => JSON.parse(JSON.stringify(o));
const cur = () => S.variants[S.cur] || null;

// Unplaced blocks wait in a parking row under the tile.
function parked(v) {
  const out = {}; let x = 0;
  for (const [n, c] of Object.entries(CAT)) {
    if (v.place && v.place[n]) continue;
    const w = (v.est && v.est[n] ? v.est[n].w : c.w), h = (v.est && v.est[n] ? v.est[n].h : c.h);
    if (x + w > W) x = 0;
    out[n] = { x, y: -40 - h, orient: 'R0', parked: true };
    x += w + 6;
  }
  return out;
}
function viewVariant(v) {           // the variant with parked blocks filled in, for drawing only
  return Object.assign({}, v, { place: Object.assign({}, parked(v), v.place || {}) });
}

// ---- store
let unsub = null;
async function connect() {
  let db = null, user = null;
  try { db = window.claude && await window.claude.use('db'); } catch (e) { db = null; }
  try { user = window.claude && await window.claude.use('user'); } catch (e) { user = null; }
  S.db = db; S.user = user;
  if (user) {
    try { S.uid = await user.id(); } catch (e) {}
    try { const c = await user.can('data.write'); if (c === false) setReadOnly(); } catch (e) {}
  }
  if (!db) { setSync('local only: changes stay in this view'); if (!S.order.length) render(); return; }
  setSync('loading…');
  db.collection('variants').onSnapshot((snap) => {
    const seen = new Set();
    for (const d of snap.docs) {
      seen.add(d.id);
      if (S.dirty.has(d.id) || S.saving.has(d.id) || (S.dragging && d.id === S.cur)) continue;
      S.variants[d.id] = clone(d.data());
    }
    for (const id of Object.keys(S.variants)) if (!seen.has(id) && !S.dirty.has(id) && !S.saving.has(id)) delete S.variants[id];
    sortOrder();
    if (!S.cur || !S.variants[S.cur]) S.cur = pickStart();
    setSync(snap.metadata.fromCache ? 'syncing…' : 'saved');
    render(); resolveNames();
  }, (e) => setSync('store unavailable: ' + e.code));
  db.doc('config/settings').onSnapshot((d) => {
    if (d.exists && !S.dirty.has('$settings')) { Object.assign(S.settings, FP.DEFAULT_SETTINGS, d.data()); render(); }
  }, () => {});
}
function pickStart() {
  let id = null; try { id = localStorage.getItem('fp.cur'); } catch (e) {}
  return id && S.variants[id] ? id : S.order[0] || null;
}
function sortOrder() {
  S.order = Object.keys(S.variants).sort((a, b) => ((S.variants[a].order ?? 99) - (S.variants[b].order ?? 99)) || a.localeCompare(b));
}
function setSync(t) { $('#sync').textContent = t; }
function setReadOnly() { S.canWrite = false; $('#app').classList.add('ro'); setSync('view only'); }

const timers = {};
function touch(id) {                // a local edit: save after a pause, one write at a time per doc
  id = id || S.cur;
  const v = S.variants[id]; if (!v) return;
  v.updatedAt = new Date().toISOString(); if (S.uid) v.updatedBy = S.uid;
  S.dirty.add(id); setSync('unsaved…');
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), 700);
  render();
}
async function flush(id) {
  if (S.dragging && id === S.cur) { timers[id] = setTimeout(() => flush(id), 300); return; }
  if (!S.db) { S.dirty.delete(id); setSync('local only: changes stay in this view'); return; }
  if (S.saving.has(id)) { timers[id] = setTimeout(() => flush(id), 300); return; }
  S.dirty.delete(id); S.saving.add(id); setSync('saving…');
  try {
    if (id === '$settings') await S.db.doc('config/settings').set(clone(S.settings));
    else if (S.variants[id]) await S.db.collection('variants').doc(id).set(clone(S.variants[id]));
    else await S.db.collection('variants').doc(id).delete();
    setSync('saved');
  } catch (e) {
    if (e && e.code === 'invalid_argument') { setReadOnly(); setSync('view only: this view cannot save'); }
    else if (e && e.code === 'quota_exceeded') setSync('store full: delete a variant');
    else setSync('save failed (' + (e && e.code || 'error') + '), retrying');
    if (e && e.code === 'unavailable') { S.dirty.add(id); timers[id] = setTimeout(() => flush(id), 1500 + Math.random() * 1000); }
  } finally { S.saving.delete(id); }
}
async function resolveNames() {
  if (!S.user || !S.user.profiles) return;
  const ids = [...new Set(Object.values(S.variants).map(v => v.updatedBy).filter(Boolean))];
  if (!ids.length) return;
  try { const ps = await S.user.profiles(ids); for (const id of ids) S.names[id] = (ps[id] && ps[id].name) || ''; renderVariantBox(); } catch (e) {}
}

// ---- view transform (SVG user units = um, y flipped)
const Y = (y) => H - y;
function fit() {
  const st = $('#stage').getBoundingClientRect();
  const v = cur(), pk = v ? Object.values(viewVariant(v).place).filter(p => p.parked) : [];
  const extra = pk.length ? Math.max(...pk.map(p => -p.y)) - 18 : 0;   // show the parking row under the tile
  const m = 10, vw = W + 2 * m, vh = H + 2 * m + 24 + Math.max(0, extra);
  const ar = st.width / Math.max(1, st.height);
  let w = vw, h = vh;
  if (w / h < ar) w = h * ar; else h = w / ar;
  S.view = { x: -m - (w - vw) / 2, y: -m - (h - vh) / 2 - 4, w, h };
}
function toUm(evt) {
  const svg = $('#cv'), r = svg.getBoundingClientRect(), v = S.view;
  const x = v.x + (evt.clientX - r.left) / r.width * v.w, sy = v.y + (evt.clientY - r.top) / r.height * v.h;
  return [x, H - sy];
}

// ---- drawing
function rectEl(r, attrs) {
  return `<rect x="${r[0]}" y="${Y(r[1] + r[3])}" width="${Math.max(0, r[2])}" height="${Math.max(0, r[3])}" ${attrs || ''}/>`;
}
function text(x, y, s, size, attrs) {
  return `<text x="${x}" y="${Y(y)}" font-size="${size}" ${attrs || ''}>${esc(s)}</text>`;
}
let last = null;
// group selection: S.sel = {kind: 'group', items: [{kind: 'inst' | 'decap', id}]}
function isSel(kind, id) {
  if (!S.sel) return false;
  if (S.sel.kind === 'group') return S.sel.items.some(q => q.kind === kind && q.id === id);
  return S.sel.kind === kind && S.sel.id === id;
}
function selItems() { return !S.sel ? [] : S.sel.kind === 'group' ? S.sel.items : (S.sel.kind === 'inst' || S.sel.kind === 'decap') ? [{ kind: S.sel.kind, id: S.sel.id }] : []; }
function setGroup(items) { S.sel = items.length === 0 ? null : items.length === 1 ? { kind: items[0].kind, id: items[0].id } : { kind: 'group', items }; }
function toggleSel(kind, id) {
  const items = selItems().slice(), i = items.findIndex(q => q.kind === kind && q.id === id);
  if (i >= 0) items.splice(i, 1); else items.push({ kind, id });
  setGroup(items);
}
function bandRect() { const b = drag; return [Math.min(b.x0, b.x1), Math.min(b.y0, b.y1), Math.abs(b.x1 - b.x0), Math.abs(b.y1 - b.y0)]; }
function decapRef(v, id) { const [b, i] = id.split('.'); return (v.decaps[b] || [])[+i - 1]; }
function itemPos(v, q) { if (q.kind === 'inst') { const p = viewVariant(v).place[q.id]; return { x: p.x, y: p.y, orient: p.orient }; } const d = decapRef(v, q.id); return { x: d.x, y: d.y }; }
function setItemPos(v, q, x, y, o) { if (q.kind === 'inst') v.place[q.id] = { x, y, orient: o.orient }; else { const d = decapRef(v, q.id); d.x = x; d.y = y; } }
function moveGroup(v, dx, dy) { for (const q of selItems()) { const o = itemPos(v, q); setItemPos(v, q, +(o.x + dx).toFixed(3), +(o.y + dy).toFixed(3), o); } }
function draw() {
  $('#stage').classList.toggle('diagram', S.mode === 'diagram');
  $('#cv').classList.toggle('dg', S.mode === 'diagram');
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
  if (S.mode === 'diagram') { if (cur()) last = FP.evaluate(DATA, CAT, cur(), S.settings); drawDiagram(); return; }
  const v = cur(); const svg = $('#cv');
  if (!S.view) fit();

  if (!S.order.length) { t.innerHTML = '<span class="empty">No variants yet</span>'; return; }
  t.innerHTML = S.order.map(id => {
    const v = S.variants[id];
    const r = FP.evaluate(DATA, CAT, viewVariant(v), S.settings);
    const f = r.checks.filter(c => c.status === 'fail').length, w = r.checks.filter(c => c.status === 'warn').length;
    return `<button class="tab" role="tab" data-tab="${esc(id)}" aria-selected="${id === S.cur}" title="${esc(v.name)}">${esc(v.name)}<span class="dots">${f} fail · ${w} warn</span></button>`;
  }).join('');
}

// Why each rule exists (docs/floorplan_spec.md "Rules, ranked" and the results behind it)
const WHY = {
  'Chain input far from the macro': 'The macro runs at 10 MHz and its 43rd / 44th harmonics (430 / 440 MHz) fall in the chain\'s 330-560 MHz band; the correlator runs all the time in RX. Anything coupled into the chain input is amplified ~80 dB, so the input section and the ua[0] / ua[1] pad wires should be as far as possible from the macro, its supply and the TT-pin wiring. Measured from the input section + pad wires to the macro halo and the TT channel / clk wire. Fails if a switching macro wire (comp_in, phi, clk, trim) crosses the chain.',
  'Late stages away from the input': 'With ~80 dB of gain, output-to-input coupling above ~0.1 fF (asymmetric) makes the chain peak or oscillate: at the ss 10 °C corner 0.2 fF gives +2.8 dB of peaking near 600 MHz and 0.5 fF oscillates. Stages 4-6, log_det\'s t4-t6 inputs and their tap wires carry the large signal, so they must stay away from the pads, the input wires and stage 1.',
  'Clock edges off the RX': 'sc_phi1 / sc_phi2 (to avg_sc), comp_in (from comp_ct) and clk switch during RX. Their edges couple into the chain and the detector, which see µV-level signals. Fails if one of these wires crosses the chain or log_det; warns when it passes closer than the threshold. Also keep the phi lines off avg_sc\'s Cavg top plates.',
  'Short analog path': 'det -> lpf -> avg_sc / comp_ct and r2r -> Ctrim -> comp.trim are slow, high-impedance nodes where tenths of a mV matter (the trim step is ~0.07 mV per LSB). Short wires keep pickup, leakage and parasitic capacitance down. The value is the sum of those Manhattan lengths.',
  'TX at ua[3] / ua[4]': 'The drivers deliver about +4 dBm at 434 MHz, and the driver -> pad wires carry the full output current (met3, 2.5 µm wide for electromigration). Long ones add loss and inductance, and act as an antenna inside the tile.',
  'Bias next to the chain': 'ib_chain (60 µA into the chain\'s current mirror) and vcm (the input common mode, through Rb) set the gain and operating point of the most sensitive block. Long wires pick up noise and coupling; ib_det and ib_comp are less critical and only reported.',
  'Decap VAPWR': 'About 50 pF on VAPWR (3.3 V) keeps ~1 V peak-to-peak of 434 MHz TX ripple off the chip\'s shared 3.3 V net, which other projects use and which would also radiate. At 30 pF the ripple rises from ~0.05 to ~0.15 V; that is the lever if area runs out. Not laid out yet: area is the estimate.',
  'Decap VDPWR': 'About 30 pF on VDPWR (1.8 V) holds up the RX and digital supply; with 30 pF the chain stays stable with up to 5 nH of supply / ground inductance. Not laid out yet: area is the estimate.',
  'TX away from the RX input': 'Soft rule: the radio is half-duplex and the TX is stopped in RX (ring off, both arms low), so TX / RX distance only matters for leakage while transmitting. Never at the cost of rules 1 and 2.',
  'Overlaps and spacing': 'Blocks need about 2-3 µm between them for guard rings and wiring (the keep-out setting). Nothing may overlap another block, sit outside the tile, or enter the macro\'s 5 µm halo.',
  'TT pin channel clear': 'The 42 TT digital pins (top edge, x 15-131) connect to the macro\'s north pins. About 42 wires run horizontally above the analog area and drop into the macro from above, which needs a channel of ~12 µm. If the macro\'s top is closer to the tile edge than that, its north pins can\'t be reached.',
  'Power straps': 'Power reaches the TT PDN through vertical met4 straps (≥ 1.2 µm wide, nearly full height); met5 is reserved for the TT PDN. A strap can\'t cross met4 shapes or MIM top plates (cap_mim_m3_1), nor the macro, which routes up to met4. Each net (VGND, VAPWR, VDPWR) needs at least one; turn on the met4 / MIM layer to see what blocks a lane.',
  'Unplaced blocks': 'Blocks still in the parking row under the tile are left out of every check. Place them to have them scored.',
};

function renderChecks() {
  const el = $('#secChecks');
  if (!last) { el.innerHTML = '<h2>Checklist</h2><p class="empty">Rules appear once a variant is open.</p>'; return; }
  const cs = last.checks, n = (s) => cs.filter(c => c.status === s).length;
  el.innerHTML = `<h2>Checklist <span class="meta">ranked rules, live</span></h2>
    <div class="summary"><span style="color:var(--fail)"><b>${n('fail')}</b> fail</span><span style="color:var(--warn)"><b>${n('warn')}</b> warn</span><span style="color:var(--pass)"><b>${n('pass')}</b> pass</span></div>
    <ol class="checks">${cs.map(c => `<li class="check ${c.status}" tabindex="0">${badge(c.status)}<span class="t">${c.rule}. ${esc(c.title)}</span><span class="v">${esc(c.value)}</span><span class="d">${esc(c.detail)}</span>${WHY[c.title] ? `<div class="why" role="tooltip"><b>Why</b>${esc(WHY[c.title])}</div>` : ''}</li>`).join('')}</ol>`;
}
function renderArea() {

    <div class="bar" role="img" aria-label="Area use"><span style="width:${pct(a.signal)}%;background:var(--rx)"></span><span style="width:${pct(a.decap)}%;background:var(--decap)"></span><span style="width:${pct(a.spacing)}%;background:var(--warn)"></span></div>
    <div class="legend"><span><i class="sw" style="background:var(--rx)"></i>signal ${k(a.signal)}</span><span><i class="sw" style="background:var(--decap)"></i>decap ${k(a.decap)} of ${k(a.decapTarget)}</span><span><i class="sw" style="background:var(--warn)"></i>spacing +10 % ${k(a.spacing)}</span></div>
    <dl class="kv"><dt>tile</dt><dd>${k(a.tile)}</dd><dt>macro + halo</dt><dd>${k(a.macro)}</dd><dt>placed incl. spacing</dt><dd>${k(used)} · ${(100 * used / a.free).toFixed(0)} %</dd>
    <dt>needed at full decap</dt><dd>${k(a.need)} · ${(100 * a.need / a.free).toFixed(0)} %</dd><dt>free left</dt><dd>${k(a.free - used)}</dd></dl>`;

function renderStraps() {
  const el = $('#secStraps'), v = cur();
  if (!v) { el.innerHTML = '<h2>Power straps</h2>'; return; }
  const st = v.straps || [];
  el.innerHTML = `<h2>Power straps <span class="meta">met4 ≥ 1.2 µm, y ${S.settings.strapY}–${f1(H - S.settings.strapY)}</span></h2>
    ${st.length ? `<table class="tbl"><tbody>${st.map((s, i) => `<tr><td><i class="sw" style="background:${STRAP_COLOR[s.net]}"></i>${s.net}</td><td class="n">x ${f1(s.x)}</td><td class="n">w ${f1(s.w)}</td><td class="n"><button class="btn" data-ss="${i}">edit</button></td></tr>`).join('')}</tbody></table>` : '<p class="empty">No straps yet.</p>'}
    <div class="row edit-only"><button class="btn" id="bStrap">Add a strap</button><button class="btn" id="bDecA">Add VAPWR decap</button><button class="btn" id="bDecD">Add VDPWR decap</button></div>
    <div class="warnbox">Straps can't cross met4 or MIM (red with the met4 layer on), or the macro. A strap inside the macro's 5 µm halo clears it.</div>`;
  el.querySelectorAll('[data-ss]').forEach(b => b.onclick = () => { S.sel = { kind: 'strap', id: +b.dataset.ss }; render(); });
  const add = $('#bStrap'); if (add) add.onclick = () => { v.straps = v.straps || []; v.straps.push({ net: 'VGND', x: 2, w: 1.2 }); S.sel = { kind: 'strap', id: v.straps.length - 1 }; touch(); };
  const ad = (base) => () => { v.decaps = v.decaps || {}; (v.decaps[base] = v.decaps[base] || []).push({ x: 0, y: -90, w: 40, h: 25 }); S.sel = { kind: 'decap', id: `${base}.${v.decaps[base].length}` }; touch(); };
  const a1 = $('#bDecA'); if (a1) a1.onclick = ad('xdeca');
  const a2 = $('#bDecD'); if (a2) a2.onclick = ad('xdecd');
}
async function saveFile(name, text) {
  let dl = null; try { dl = window.claude && await window.claude.use('downloads'); } catch (e) {}
  if (dl) { try { await dl.save({ filename: name, data: text }); setSync('file offered'); return; } catch (e) { if (e && e.code === 'declined') return; } }
  copy(text);
}
async function copy(t) {
  try { await navigator.clipboard.writeText(t); setSync('copied'); }
  catch (e) { const ta = $('#ioText'); ta.value = t; ta.closest('details').open = true; ta.select(); setSync('select and copy the JSON'); }
}
function renderIO() {
  const el = $('#secIO'), v = cur();
  el.innerHTML = `<h2>floorplan.json <span class="meta">layout/floorplan/</span></h2>
    <div class="row"><button class="btn primary" id="bExp" ${v ? '' : 'disabled'}>Save floorplan.json</button><button class="btn" id="bCopy" ${v ? '' : 'disabled'}>Copy JSON</button></div>
    <details><summary>Show / paste JSON</summary><textarea id="ioText" rows="8" placeholder="Paste a floorplan.json here, then import it"></textarea>
    <div class="row edit-only"><button class="btn" id="bImp">Import as a new variant</button><label class="btn">Open a file<input type="file" id="ioFile" accept=".json,application/json" hidden></label></div></details>
    <p class="empty" style="margin:0">x, y are the lower-left of each placed bbox; rot / mirror give the KLayout DCplxTrans for layout/gen/top.py.</p>`;
  const json = () => JSON.stringify(FP.exportJSON(DATA, CAT, v), null, 1);
  if (v) { $('#bExp').onclick = () => saveFile('floorplan.json', json()); $('#bCopy').onclick = () => copy(json()); }
  const imp = (txt) => { try { const j = JSON.parse(txt); const nv = FP.importJSON(CAT, j); addVariant(nv); } catch (e) { setSync('import failed: ' + e.message); } };
  const bi = $('#bImp'); if (bi) bi.onclick = () => imp($('#ioText').value);
  const fi = $('#ioFile'); if (fi) fi.onchange = () => { const f = fi.files[0]; if (f) f.text().then(imp); };
}
function renderSettings() {
  const el = $('#secSettings'), s = S.settings;
  const fields = [['keepout', 'keep-out between blocks, µm'], ['channel', 'TT pin channel height, µm (0 = off)'], ['r1', '1. input ↔ macro ≥'], ['r2', '2. late ↔ input ≥'], ['r3', '3. clocks ↔ RX ≥'],
    ['r4', '4. analog path ≤'], ['r5', '5. driver → pad ≤'], ['r6', '6. ib_chain, vcm ≤'], ['r8', '8. TX ↔ RX input ≥'], ['deca', 'VAPWR decap target, µm²'], ['decd', 'VDPWR decap target, µm²'], ['strapY', 'strap end inset, µm']];
  el.innerHTML = `<h2>Thresholds <span class="meta">shared with everyone</span></h2>
    <div class="row">${fields.map(([k, l]) => `<label class="f">${l}<input type="number" step="0.5" data-set="${k}" value="${s[k]}"></label>`).join('')}</div>
    <div class="row edit-only"><button class="btn" id="bReset">Reset to defaults</button></div>`;
  el.querySelectorAll('[data-set]').forEach(i => i.onchange = () => { const x = +i.value; if (isFinite(x)) { s[i.dataset.set] = x; S.dirty.add('$settings'); clearTimeout(timers.$s); timers.$s = setTimeout(() => flush('$settings'), 600); render(); } });
  const br = $('#bReset'); if (br) br.onclick = () => { Object.assign(s, FP.DEFAULT_SETTINGS); S.dirty.add('$settings'); flush('$settings'); render(); };
}
function renderLayers() {
  $('#layers').innerHTML = Object.entries({ flylines: 'flylines', pins: 'pins', labels: 'labels', decap: 'decap', m4: 'met4 / MIM', grid: 'grid' })
    .map(([k, l]) => `<label class="chip"><input type="checkbox" id="ly_${k}" data-layer="${k}" ${S.layers[k] ? 'checked' : ''}>${l}</label>`).join('') +
    `<button class="chip" id="bFit">fit</button>`;
  document.querySelectorAll('[data-layer]').forEach(c => c.onchange = () => { S.layers[c.dataset.layer] = c.checked; try { localStorage.setItem('fp.layers', JSON.stringify(S.layers)); } catch (e) {} draw(); });
  $('#bFit').onclick = () => { fit(); draw(); };
}
function render() {
  draw(); renderTabs(); renderVariantBox(); renderSel(); renderChecks(); renderArea(); renderNets(); renderStraps(); renderIO(); renderSettings();
  const has = !!cur();
  for (const b of ['#bDup', '#bRen', '#bDel']) $(b).disabled = !has;
}

// ---- variant actions
function newId() { return 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function addVariant(v) {
  const id = newId();
  v.order = Math.max(0, ...Object.values(S.variants).map(x => x.order || 0)) + 1;
  S.variants[id] = v; sortOrder(); S.cur = id; S.sel = null; touch(id);
}
function newBlank() {
  addVariant({ name: 'Blank', note: '', place: { macro: { x: 228.12, y: 23.76, orient: 'R0' } }, decaps: {}, straps: [], est: {} });
}
$('#bNew').onclick = newBlank;
$('#bFull').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (e) { setSync('full screen not available here: open the link in its own tab'); }
};
document.addEventListener('fullscreenchange', () => { $('#bFull').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; setTimeout(() => { fit(); draw(); }, 50); });
$('#bDup').onclick = () => { const v = cur(); if (!v) return; const c = clone(v); c.name = v.name.replace(/( \(copy\))*$/, '') + ' (copy)'; addVariant(c); };
$('#bRen').onclick = () => {
  const v = cur(); if (!v) return;
  const tab = document.querySelector(`[data-tab="${CSS.escape(S.cur)}"]`);
  const inp = document.createElement('input'); inp.type = 'text'; inp.id = 'renameInput'; inp.value = v.name; inp.style.width = '260px';
  tab.replaceWith(inp); inp.focus(); inp.select();
  const done = (ok) => { if (ok && inp.value.trim()) { v.name = inp.value.trim(); touch(); } else render(); };
  inp.onkeydown = (e) => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); };
  inp.onblur = () => done(true);
};
let delArm = 0;
$('#bDel').onclick = () => {
  const b = $('#bDel');
  if (Date.now() - delArm > 3000) { delArm = Date.now(); b.textContent = 'Delete? click again'; setTimeout(() => { b.textContent = 'Delete'; }, 3000); return; }
  delArm = 0; b.textContent = 'Delete';
  const id = S.cur; delete S.variants[id]; sortOrder(); S.cur = S.order[0] || null; S.sel = null;
  S.dirty.add(id); flush(id); render();
};
$('#tabs').addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]'); if (!t) return;
  S.cur = t.dataset.tab; S.sel = null; try { localStorage.setItem('fp.cur', S.cur); } catch (err) {} fit(); render();
});

// ---- canvas interaction
const svg = $('#cv');
let drag = null;
function setOrient(n, o) {
  const v = cur(), vv = viewVariant(v), p = vv.place[n], c = CAT[n];
  const est = v.est && v.est[n] ? v.est[n] : { w: c.w, h: c.h };
  const [w0, h0] = FP.placedSize(p.orient, est.w, est.h), [w1, h1] = FP.placedSize(o, est.w, est.h);
  v.place[n] = { x: snap(p.x + (w0 - w1) / 2), y: snap(p.y + (h0 - h1) / 2), orient: o };
  touch();
}
svg.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  if (S.mode === 'diagram') {
    const g = e.target.closest('[data-dinst]');
    if (g && CAT[g.dataset.dinst]) { S.sel = { kind: 'inst', id: g.dataset.dinst }; setMode('layout'); render(); }
    return;
  }
  const v = cur(); const [x, y] = toUm(e);
  let gi = e.target.closest('[data-inst]'), gd = e.target.closest('[data-decap]'); const gs = e.target.closest('[data-strap]');
  if (v && !gi && !gd && !gs && !e.target.closest('[data-resize]')) {   // a flyline or label on top: hit-test the blocks underneath
    const R0 = FP.resolve(CAT, viewVariant(v)), inR = (r) => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3];
    const bi = Object.values(R0.inst).filter(i => inR(i.rect)).sort((a, b) => a.rect[2] * a.rect[3] - b.rect[2] * b.rect[3])[0];
    const bd = S.layers.decap ? R0.decaps.filter(d => inR(d.rect)).sort((a, b) => a.rect[2] * a.rect[3] - b.rect[2] * b.rect[3])[0] : null;
    const pick = bi && bd ? (bi.rect[2] * bi.rect[3] <= bd.rect[2] * bd.rect[3] ? 'i' : 'd') : bi ? 'i' : bd ? 'd' : null;
    if (pick === 'i') gi = { dataset: { inst: bi.name } }; else if (pick === 'd') gd = { dataset: { decap: bd.name } };
  }
  svg.setPointerCapture(e.pointerId);
  if (v && e.shiftKey && (gi || gd)) {                       // shift-click: add to / remove from the group
    toggleSel(gi ? 'inst' : 'decap', gi ? gi.dataset.inst : gd.dataset.decap); drag = null; render(); return;
  }
  if (v && e.shiftKey && !gs) {                              // shift-drag on empty space: selection box
    drag = { kind: 'band', x0: x, y0: y, x1: x, y1: y, keep: selItems().slice() }; S.dragging = false; draw(); return;
  }
  const hit = gi ? { kind: 'inst', id: gi.dataset.inst } : gd && !e.target.dataset.resize ? { kind: 'decap', id: gd.dataset.decap } : null;
  if (v && S.canWrite && hit && S.sel && S.sel.kind === 'group' && isSel(hit.kind, hit.id)) {   // drag the whole group
    drag = { kind: 'group', x0: x, y0: y, orig: S.sel.items.map(q => [q, itemPos(v, q)]) }; S.dragging = true; render(); return;
  }
  if (v && S.canWrite && gi) {
    const n = gi.dataset.inst, p = viewVariant(v).place[n];
    S.sel = { kind: 'inst', id: n }; drag = { kind: 'inst', n, dx: x - p.x, dy: y - p.y, p0: p, moved: false };
  } else if (v && S.canWrite && gd) {
    const [base, i] = gd.dataset.decap.split('.'), d = v.decaps[base][+i - 1];
    S.sel = { kind: 'decap', id: gd.dataset.decap };
    drag = e.target.dataset.resize ? { kind: 'resize', d, x0: d.x, y1: d.y + d.h } : { kind: 'decap', d, dx: x - d.x, dy: y - d.y };
  } else if (v && S.canWrite && gs) {
    const st = v.straps[+gs.dataset.strap]; S.sel = { kind: 'strap', id: +gs.dataset.strap }; drag = { kind: 'strap', st, dx: x - st.x };
  } else if (!S.canWrite && (gi || gd || gs)) {
    S.sel = gi ? { kind: 'inst', id: gi.dataset.inst } : gd ? { kind: 'decap', id: gd.dataset.decap } : { kind: 'strap', id: +gs.dataset.strap };
    drag = { kind: 'pan', cx: e.clientX, cy: e.clientY, v0: Object.assign({}, S.view) };
  } else {
    if (e.target === svg || !e.target.closest('[data-net]')) S.sel = null;
    drag = { kind: 'pan', cx: e.clientX, cy: e.clientY, v0: Object.assign({}, S.view) }; svg.classList.add('panning');
  }
  S.dragging = drag.kind !== 'pan';
  render();
});
svg.addEventListener('pointermove', (e) => {
  const [x, y] = toUm(e);
  $('#coords').textContent = `x ${x.toFixed(1)}, y ${y.toFixed(1)} µm`;
  const tip = $('#tip');
  const tn = e.target.closest && e.target.closest('[data-net]');
  if (tn && last && !drag) {
    const n = last.nets.find(q => q.name === tn.dataset.net);
    if (n) { const r = $('#stage').getBoundingClientRect(); tip.hidden = false; tip.textContent = `${n.name}: ${n.a.replace('pad:', '')} → ${n.b.replace('pad:', '')}  ${n.len.toFixed(1)} µm`; tip.style.left = (e.clientX - r.left + 12) + 'px'; tip.style.top = (e.clientY - r.top + 12) + 'px'; }
    if (S.hoverNet !== n.name) { S.hoverNet = n.name; draw(); }
  } else if (!drag) { tip.hidden = true; if (S.hoverNet) { S.hoverNet = null; draw(); } }
  if (!drag) return;
  const v = cur();
  if (drag.kind === 'pan') {
    const r = svg.getBoundingClientRect();
    S.view.x = drag.v0.x - (e.clientX - drag.cx) / r.width * S.view.w;
    S.view.y = drag.v0.y - (e.clientY - drag.cy) / r.height * S.view.h;
    draw(); return;
  }
  if (drag.kind === 'band') { drag.x1 = x; drag.y1 = y; draw(); return; }
  if (drag.kind === 'group') {
    const dx = snap(x - drag.x0), dy = snap(y - drag.y0);
    for (const [q, o] of drag.orig) setItemPos(v, q, +(o.x + dx).toFixed(3), +(o.y + dy).toFixed(3), o);
    drag.moved = dx !== 0 || dy !== 0; draw(); renderChecks(); return;
  }
  if (drag.kind === 'inst') { v.place[drag.n] = { x: snap(x - drag.dx), y: snap(y - drag.dy), orient: drag.p0.orient }; drag.moved = true; }
  else if (drag.kind === 'decap') { drag.d.x = snap(x - drag.dx); drag.d.y = snap(y - drag.dy); }
  else if (drag.kind === 'resize') { drag.d.w = Math.max(2, snap(x - drag.x0)); const ny = Math.min(drag.y1 - 2, snap(y)); drag.d.h = drag.y1 - ny; drag.d.y = ny; }
  else if (drag.kind === 'strap') { drag.st.x = Math.round((x - drag.dx) * 10) / 10; }
  draw(); renderChecks();
});
function endDrag() {
  if (!drag) return;
  const was = drag; drag = null; S.dragging = false; svg.classList.remove('panning');
  if (was.kind === 'band') {
    const v = cur(), b = [Math.min(was.x0, was.x1), Math.min(was.y0, was.y1), Math.abs(was.x1 - was.x0), Math.abs(was.y1 - was.y0)];
    const R0 = FP.resolve(CAT, viewVariant(v)), items = was.keep.slice();
    const add = (kind, id) => { if (!items.some(q => q.kind === kind && q.id === id)) items.push({ kind, id }); };
    if (b[2] > 0.5 || b[3] > 0.5) {
      for (const i of Object.values(R0.inst)) if (FP.overlap(i.rect, b) > 0) add('inst', i.name);
      if (S.layers.decap) for (const d of R0.decaps) if (FP.overlap(d.rect, b) > 0) add('decap', d.name);
    }
    setGroup(items); render(); return;
  }
  if (was.kind === 'group') { if (was.moved) touch(); else render(); return; }
  if (was.kind !== 'pan') touch(); else render();
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('wheel', (e) => {
  if (S.mode === 'diagram') return;
  e.preventDefault();
  const r = svg.getBoundingClientRect(), k = Math.exp(e.deltaY * 0.0015);
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  const nw = Math.min(2000, Math.max(20, S.view.w * k)), nh = S.view.h * nw / S.view.w;
  S.view.x += (S.view.w - nw) * fx; S.view.y += (S.view.h - nh) * fy; S.view.w = nw; S.view.h = nh;
  draw();
}, { passive: false });
document.addEventListener('keydown', (e) => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName)) return;
  if (S.mode === 'diagram') return;
  if (e.key === 'f' || e.key === 'F') { fit(); draw(); return; }
  if (e.key === 'Escape' && S.sel) { S.sel = null; render(); return; }
  const v = cur(); if (!v || !S.sel || !S.canWrite) return;
  if (S.sel.kind === 'group') {
    const st = e.shiftKey ? 5 : 0.5, dir = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, st], ArrowDown: [0, -st] }[e.key];
    if (dir) { e.preventDefault(); moveGroup(v, dir[0], dir[1]); touch(); }
    return;
  }
  if (S.sel.kind === 'inst') {
    const n = S.sel.id, p = viewVariant(v).place[n];
    const op = { r: 'rot', R: 'rot', x: 'mx', X: 'mx', y: 'my', Y: 'my' }[e.key];
    if (op) { setOrient(n, FP.compose(p.orient, op)); e.preventDefault(); return; }
  }
  const st = e.shiftKey ? 5 : 0.5, dir = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, st], ArrowDown: [0, -st] }[e.key];
  if (!dir) return;
  e.preventDefault();
  if (S.sel.kind === 'inst') { const p = viewVariant(v).place[S.sel.id]; v.place[S.sel.id] = { x: p.x + dir[0], y: p.y + dir[1], orient: p.orient }; }
  else if (S.sel.kind === 'decap') { const [b, i] = S.sel.id.split('.'); const d = v.decaps[b][+i - 1]; d.x += dir[0]; d.y += dir[1]; }
  else if (S.sel.kind === 'strap') { v.straps[S.sel.id].x = Math.round((v.straps[S.sel.id].x + dir[0] / 5) * 10) / 10; }
  touch();
});
new ResizeObserver(() => { const old = S.view; fit(); if (old) { /* keep zoom on resize only when first fitting */ } draw(); }).observe($('#stage'));

renderLayers();
if (window.FP_DEV_VARIANTS) {        // local preview hook (not used in the published page)
  for (const v of window.FP_DEV_VARIANTS) { S.variants[v.id] = clone(v); }
  sortOrder(); S.cur = S.order[0];
}
render();
connect();
})();
</script>
